server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит под загрузку видео; на этапе 3 вынесем в отдельный location
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs         { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }

    # /media/ internal добавим на этапе 4

    location / {
        try_files $uri $uri/ /index.html;
    }
}